name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual run, useful for re-trying after a transient external action
  # (HACS/hassfest) failure without pushing an empty commit.
  workflow_dispatch:

# Cancel in-flight runs for the same PR/branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install ruff
        # Use the same pin as requirements_test.txt so local + CI agree.
        run: pip install $(grep -E "^ruff==" requirements_test.txt)

      - name: ruff check
        run: ruff check custom_components/ tests/

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Home Assistant 2026.3+ requires Python >= 3.14.2, and so does the
          # pytest-homeassistant-custom-component that carries it. Anything
          # older silently resolves to a pre-2026.3 core (see
          # requirements_test.txt).
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=custom_components --cov-report=term-missing

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Official HA validator. Runs the same checks core HA uses on built-in
      # integrations: manifest schema, domain naming, version bumps, etc.
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # HACS-specific validator. Verifies hacs.json, manifest.json, and that
      # the repo layout matches what HACS expects of an integration.
      - uses: hacs/action@main
        with:
          category: integration
